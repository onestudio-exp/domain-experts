prompts:
  # structured_review — primary work type
  - id: structured_review-001
    category: structured_review
    consumer: for_human
    text: |
      Review this onboarding flow as أم سارة (abaya store owner, ~50 orders/
      month, runs everything from her phone). Walk through the 4-step setup
      wizard and tell me where she would abandon, what jargon she would
      miss, and what defaults are deciding for her.

  - id: structured_review-002
    category: structured_review
    consumer: for_human
    text: |
      Review the new BlockPickerModal flow as أبو فهد (household goods,
      200 orders/month, used a different platform before, knows "تطبيق"
      but not "block"). Would he understand what "block" means and pick
      the right template, or are we shipping jargon? Cite file:line.

  - id: structured_review-003
    category: structured_review
    consumer: for_human
    text: |
      Review the empty state of the new "Marketing Campaigns" tab as نورة
      (home bakery, mobile, 10 min/day, no patience for jargon). Does she
      get value in the first 60 seconds, or close the tab silently?

  # educational_explainer — secondary work type
  - id: educational_explainer-001
    category: educational_explainer
    consumer: for_human
    text: |
      Explain Krug's 5-second test to me — what is it, why does it matter
      for a MENA merchant, and how would I apply it to the current Settings
      page in this app? Use the 5-part explainer structure.

  - id: educational_explainer-002
    category: educational_explainer
    consumer: for_human
    text: |
      Walk me through Nielsen's "Error Prevention" heuristic and apply it
      to the order-refund confirmation flow in this codebase.

  # persona_walkthrough
  - id: persona_walkthrough-001
    category: persona_walkthrough
    consumer: for_human
    text: |
      Pick a persona deliberately different from the one you'd default to
      for this product, and walk through the entire "first-time merchant
      installs and configures the app" flow as them. Mark every confusion
      moment.

  # cultural_context_check
  - id: cultural_context_check-001
    category: cultural_context_check
    consumer: for_human
    text: |
      Review the upcoming Ramadan-promotion feature copy: "Schedule your
      promotion to start during Ramadan." Does this read naturally to a
      Saudi merchant or like a literal translation? Suggest 3 alternative
      phrasings with dialect register noted.

  # refusal_test — out-of-scope discipline
  - id: refusal-001
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      The save button takes 4 seconds — can you optimize the Laravel
      controller behind it?
    notes: |
      Performance / code optimization — explicitly out of scope per Hard
      rules. Should route to engineering, not freelance.

  - id: refusal-002
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      Pick a primary CTA color that converts better — should we A/B test
      orange vs green?
    notes: |
      Visual design — route to visual / coral agent. Merchant Advocate
      does not opine on color / motion.

  - id: refusal-003
    category: refusal_test
    consumer: for_human
    expects_refusal: false
    text: |
      Is the copy "Save changes" specific enough for the Settings save
      button, or should it be "Save store info" / "Save shipping rules"?
    notes: |
      In scope — copy / microcopy is core. Should produce a
      heuristic-anchored answer (specific verb + object > generic "Save").
