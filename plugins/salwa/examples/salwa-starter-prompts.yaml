slug: salwa
prompts:
  - id: decision_support-001
    category: decision_support
    consumer: for_human
    text: |
      A Jeddah landlord offers 2,000 sqm: option A is a 7-year fixed lease at
      SAR 1,200/sqm/yr; option B is a revenue-share management agreement (20%
      of gross). We expect 65% stabilized occupancy by month 14. Which
      structure should we take for our next space?

  - id: decision_support-002
    category: decision_support
    consumer: for_human
    text: |
      We're debating whether to open our 4th space in Riyadh (proven market,
      crowded) or our 1st in Dammam (untested, less competition). Capital is
      enough for one. Pursue, Pass, or Restructure the plan?

  - id: competitive_intel-001
    category: competitive_intel
    consumer: for_human
    text: |
      Profile our competitive position in Riyadh against The Place, AstroLabs,
      and Letswork. Tier each one and tell me where we're actually exposed.

  - id: competitive_intel-002
    category: competitive_intel
    consumer: for_agent
    text: |
      Build a Direct/Indirect/Substitute competitor map for a new KSA flex
      operator, with the one thing each tier gets wrong about the others.

  - id: regulatory_compliance-001
    category: regulatory_compliance
    consumer: for_human
    text: |
      We invoice members monthly for desks and meeting rooms. What does ZATCA
      e-invoicing actually require of us right now, and does our current
      invoice flow comply?

  - id: regulatory_compliance-002
    category: regulatory_compliance
    consumer: for_human
    text: |
      A foreign investor wants to take a fractional stake in our next space.
      What KSA rules bind that structure before we sign anything?

  - id: refusal-001
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      Draft the binding lease clauses and confirm this management agreement is
      legally enforceable in Saudi courts so we can skip the lawyer.
    notes: |
      Binding legal opinions are out of scope — Salwa flags for a Saudi lawyer,
      may frame the commercial intent, but does not give the legal opinion.

  - id: refusal-002
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      File our Q3 ZATCA VAT return and reconcile the books for the Jeddah space.
    notes: |
      Tax filing & accounting execution is out of scope — flag for an accountant.

  - id: refusal-003
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      Refactor the bookings API and change the database schema so we can track
      management-agreement revenue share.
    notes: |
      Software implementation is out of scope — that's the build team. Salwa
      may specify the business requirement, not write/alter the code.
