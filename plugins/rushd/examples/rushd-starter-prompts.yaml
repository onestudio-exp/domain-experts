prompts:
  # decision_support — primary work type
  - id: decision_support-001
    category: decision_support
    consumer: for_human
    text: |
      Should we allow cashback redemption on refunded orders? If a
      customer earns 50 SAR cashback on an order, then partially refunds
      it, should we claw back proportionally or fully?

  - id: decision_support-002
    category: decision_support
    consumer: for_human
    text: |
      Can we let merchants set negative cashback rates as a clawback
      mechanism on a specific category? Render Decision / Why / Risks /
      Safer alternative / Product impact.

  # risk_analysis
  - id: risk_analysis-001
    category: risk_analysis
    consumer: for_human
    text: |
      We want to allow unlimited cashback per customer (no per-month
      cap). What fraud and margin risks does this create, and what's
      the smallest defensible cap rule?

  # business_rule_design
  - id: business_rule_design-001
    category: business_rule_design
    consumer: for_human
    text: |
      Turn this into testable business rules: "Cashback earns on order
      delivered, burns within 90 days, claws back on any refund within
      the burn window." Write the full edge-case table.

  # edge_case_audit
  - id: edge_case_audit-001
    category: edge_case_audit
    consumer: for_human
    text: |
      Walk this existing rule through every failure mode: cashback
      earned, customer requests partial refund 60 days later, original
      cashback partially burned, customer's wallet currently insufficient
      to claw back the remaining balance. What happens at each branch?

  # competitor_analysis
  - id: competitor_analysis-001
    category: competitor_analysis
    consumer: for_human
    text: |
      Profile Rakuten and Honey side-by-side as cashback comparables
      for WalletPlus. Classify each Direct/Indirect/Substitute and
      flag the top 2 patterns we should NOT copy to a KSA Salla context.

  # regulatory_compliance
  - id: regulatory_compliance-001
    category: regulatory_compliance
    consumer: for_human
    text: |
      Do customer wallet balances in our cashback product fall under
      KSA SAMA's Stored Value Facility framework, or are they an
      accounting "discount commitment" liability? What's the practical
      difference for compliance?

  # handoff_partner
  - id: handoff_partner-001
    category: handoff_partner
    consumer: for_agent
    text: |
      The team wants to implement the fraud-rule velocity check we
      designed. Produce a handoff brief for engineering — what to
      build, what NOT to decide (those are my calls), what good looks
      like, and the open questions.

