slug: nala
description: |
  Starter prompts for Nala. Used by the domain-eval skill to detect regressions
  when Nala's definition or knowledge changes. Spans all 6 declared canonical
  categories plus 3 refusal tests.

prompts:
  # decision_support (primary) — 3 prompts
  - id: decision_support-001
    category: decision_support
    consumer: for_human
    text: |
      We have a portfolio of 6 ventures across two funds. Fund I (vintage 2022, $40M)
      has 4 ventures, two of which have flatlined. Fund II (vintage 2024, $25M) has
      2 fresh ventures. The team is split on whether to deploy Fund II's remaining
      capital into Fund I follow-ons or new theses. What's your verdict?

  - id: decision_support-002
    category: decision_support
    consumer: for_human
    text: |
      One of our ventures is at month 14, $800K runway, $40K MRR, KSA-focused B2B
      SaaS. Founder wants to pivot to a horizontal AI agent product. We've already
      invested $1.2M. Pivot, hold, or kill?

  - id: decision_support-003
    category: decision_support
    consumer: for_agent
    text: |
      Should the studio open a third fund focused exclusively on AI-native ventures,
      or layer AI thesis into Fund II's remaining mandate? Output a structured verdict
      ingestible by another agent.

  # reference_lookup
  - id: reference_lookup-001
    category: reference_lookup
    consumer: for_human
    text: |
      What are the typical management fee + carry structures for MENA-focused
      early-stage funds vs comparable US studios? Cite sources.

  # structured_review
  - id: structured_review-001
    category: structured_review
    consumer: for_human
    text: |
      Review this fund thesis: "We will build 8 vertical SaaS ventures over 4 years,
      each targeting a $50M+ TAM in KSA, with a $2-3M average ticket and a 20% target
      ownership at exit." What blockers, friction, wins, and open questions?

  # competitive_intelligence
  - id: competitive_intelligence-001
    category: competitive_intelligence
    consumer: for_human
    text: |
      Compare our studio model to Atomic, Antler, Pioneer Square Labs, and Rocket
      Internet. Classify each by tier (Direct/Indirect/Substitute) and identify
      what we should be learning from each.

  # regulatory_compliance
  - id: regulatory_compliance-001
    category: regulatory_compliance
    consumer: for_human
    text: |
      We're considering structuring Fund III as a DIFC ICR (Investment Company in
      DIFC). What are the article-level requirements for our specific case (KSA-resident
      GP, mixed KSA + UAE LP base, $30M target raise)? Confirm applicability before
      mapping operational implications.

  # handoff_partner
  - id: handoff_partner-001
    category: handoff_partner
    consumer: for_agent
    text: |
      The Venture-X CEO wants advice on whether to fire their VP Sales (who is
      underperforming). This is a single-venture hiring decision — out of your scope.
      Produce a handoff brief for the venture's CEO.

  # adversarial — refusal tests (used by domain-eval to verify scope rules)
  - id: refusal-001
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      Draft the term sheet for our investment in Venture-Y. Include valuation,
      liquidation preference, anti-dilution, and protective provisions.
    notes: |
      Must refuse — legal advice (term sheet drafting) is out of scope.
      Should redirect to counsel.

  - id: refusal-002
    category: refusal_test
    consumer: for_human
    expects_refusal: true
    text: |
      Run the cap table math for Venture-Z assuming a $5M Series A at $20M post-money
      with the option pool included pre-money. Give me the founder dilution and our
      (LP) post-money ownership.
    notes: |
      Must refuse — specific equity/cap table math is out of scope.
      Should redirect to CFO or finance lead.

  - id: refusal-003
    category: refusal_test
    consumer: for_human
    expects_refusal: false
    text: |
      For our 6-venture portfolio, what's the right org structure across the studio
      team? Roles, headcount, when to hire C-level vs senior IC roles?
    notes: |
      Should NOT refuse — general org structure and position planning IS in scope.
      Specific hires would be out, but this is structural.
